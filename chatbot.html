<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AURA Assistant (PHP Backend)</title>

<style>
:root {
  --green: #22c55e;
  --bg: rgba(10, 25, 10, 0.92);
}
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: white;
  font-family: "Poppins", sans-serif;
}
#chatbot-container {
  height: 100vh;
  display: flex;
  flex-direction: column;
  border: 2px solid var(--green);
}
#chatbot-header {
  background: var(--green);
  color: #000;
  padding: 10px;
  font-weight: 700;
  text-align: center;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
#controls {
  display: flex;
  gap: 8px;
  align-items: center;
}
.ctrl-btn {
  background: transparent;
  border: none;
  font-size: 18px;
  cursor: pointer;
}
#chat-messages {
  flex: 1;
  padding: 12px;
  overflow-y: auto;
  font-size: 14px;
  line-height: 1.5;
}
.user { text-align: right; color: var(--green); margin-bottom: 6px; }
.bot { text-align: left; margin-bottom: 6px; }
.typing { opacity: 0.6; font-style: italic; }

#chat-input-area {
  display: flex;
  border-top: 1px solid rgba(255,255,255,0.2);
}
#chat-input {
  flex: 1;
  padding: 10px;
  background: rgba(255,255,255,0.1);
  border: none;
  outline: none;
  color: white;
}
#chat-send {
  width: 55px;
  background: var(--green);
  border: none;
  cursor: pointer;
  font-size: 18px;
  color: #000;
}
#upload-image-btn {
  background:#16a34a;
  color:white;
  border:none;
  padding:6px 10px;
  border-radius:10px;
  cursor:pointer;
  font-size:13px;
  margin:5px;
  width:95%;
}
</style>
</head>

<body>

<div id="chatbot-container">
  <div id="chatbot-header">
    🤖 AURA Assistant
    <div id="controls">
      <button class="ctrl-btn" id="micBtn">🎙️</button>
      <button class="ctrl-btn" id="ttsBtn">🔊</button>
    </div>
  </div>

  <div id="chat-messages"></div>

  <button id="upload-image-btn">📸 Upload Pest/Leaf Image</button>
  <input type="file" id="pest-file" accept="image/*" style="display:none;">

  <div id="chat-input-area">
    <input id="chat-input" placeholder="Ask about farming, soil, pests…">
    <button id="chat-send">➤</button>
  </div>
</div>

<script>
let ttsEnabled = true;
let msgBox = document.getElementById("chat-messages");
let chatInput = document.getElementById("chat-input");
let pestFile = document.getElementById("pest-file");

function addUser(m){ msgBox.innerHTML += `<div class='user'>${m}</div>`; scroll(); }
function addBot(m){ msgBox.innerHTML += `<div class='bot'>${m}</div>`; scroll(); speak(m.replace(/<[^>]*>/g,"")); }
function addTyping(){ msgBox.innerHTML += `<div class='typing' id='typing'>AURA is thinking...</div>`; scroll(); }
function removeTyping(){ let t=document.getElementById('typing'); if(t) t.remove(); }
function scroll(){ msgBox.scrollTop = msgBox.scrollHeight; }
function speak(t){ if(!ttsEnabled) return; let u=new SpeechSynthesisUtterance(t); u.lang="en-IN"; speechSynthesis.speak(u); }

/* Send Chat Message to PHP Groq API */
async function sendChat(text){
  addTyping();
  try{
    const res = await fetch("chatbot_api.php", {
      method:"POST",
      headers:{ "Content-Type":"application/json" },
      body: JSON.stringify({ message:text })
    });
    const raw = await res.text();

    try {
      removeTyping();
      let data = JSON.parse(raw);
      addBot(data.reply);
    } catch(e){
      removeTyping();
      addBot("⚠ Groq Error:<br><pre>"+raw+"</pre>");
    }

  } catch(e){
    removeTyping();
    addBot("⚠ Network Error: " + e.message);
  }
}

/* Pest Image Upload */
async function sendImage(file){
  addUser("📸 Image uploaded… Analyzing!");
  addTyping();

  const fd = new FormData();
  fd.append("image", file);

  try{
    const res = await fetch("pest_detect.php", {
      method:"POST",
      body: fd
    });

    const raw = await res.text();
    try {
      removeTyping();
      let data = JSON.parse(raw);
      addBot(data.reply);
    } catch(e){
      removeTyping();
      addBot("⚠ Vision Model Error:<br><pre>"+raw+"</pre>");
    }

  } catch(e){
    removeTyping();
    addBot("⚠ Upload Error: " + e.message);
  }
}

document.getElementById("chat-send").onclick = ()=> {
  let t = chatInput.value.trim();
  if(!t) return;
  addUser(t);
  chatInput.value = "";
  sendChat(t);
};

chatInput.addEventListener("keypress", e => e.key === "Enter" && document.getElementById("chat-send").click());
document.getElementById("upload-image-btn").onclick = ()=> pestFile.click();
pestFile.onchange = ()=> sendImage(pestFile.files[0]);

document.getElementById("ttsBtn").onclick = ()=>{
  ttsEnabled = !ttsEnabled;
  document.getElementById("ttsBtn").textContent = ttsEnabled ? "🔊" : "🔈";
};

addBot("Hello! I'm <b>AURA</b> 🌾 Ask anything or upload pest image 📸");
</script>

</body>
</html>
